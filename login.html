<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · Boshehri Amber</title><meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0C0C"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Boshehri Amber">
<script>(function(){try{var l=JSON.parse(localStorage.getItem('ba-lang')||'"en"'),t=JSON.parse(localStorage.getItem('ba-theme')||'"dark"');document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Manrope:wght@500;600;700&family=Tajawal:wght@500;700;800&display=swap">
<link rel="stylesheet" href="styles.css"></head>
<body data-page="login" data-where="login" data-login="login.html">
<main class="auth">
  <form class="panel" id="login-form" novalidate>
    <h1 data-i18n="login">Log in</h1>
    <p class="hint" data-i18n="loginHint">Members see their cart, favorites and orders in one place.</p>
    <div class="demo"><span>⚠️</span><div><b data-i18n="demoB">Demo only. Do not use a real password.</b><span data-i18n="demoT">This is a front-end mockup.</span></div></div>
    <label for="email" data-i18n="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="off" data-i18n-ph="phEmail" placeholder="you@example.com">
    <label for="password" data-i18n="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="off" data-i18n-ph="phPass" placeholder="anything works in the demo">
    <p class="err" id="err" data-i18n="err">Please type an email and a password.</p>
    <button class="btn gold wide" type="submit" style="margin-top:20px" data-i18n="enter">Enter the members area</button>
  </form>
</main>
<script src="shell.js"></script><script src="app.js"></script>
</body></html>
